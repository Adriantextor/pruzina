version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: spring_backend
    ports:
      - "8081:8081"
      - "9001:9001"
    volumes:
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/spring_simulator.db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: spring_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - ./simulator:/usr/share/nginx/html/simulator:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
